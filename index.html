<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salud en Casa SURA - Evaluación de Atención</title>
  <style>
    :root {
      --sura-blue: #0033a0;
      --sura-light-blue: #00a9e0;
      --bg-light: #f4f7f9;
      --text-dark: #1e293b;
      --text-muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 51, 160, 0.08);
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .header-banner {
      width: 100%;
      background: #ffffff;
      padding: 14px 16px 4px;
      display: flex;
      justify-content: center;
      border-bottom: 2px solid #f1f5f9;
    }
    .header-banner img {
      width: 100%;
      max-height: 110px;
      object-fit: contain;
    }
    .content {
      padding: 24px 20px;
    }
    .badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .program-title {
      color: var(--sura-blue);
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .staff-container {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .staff-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .staff-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 2px;
    }
    .staff-role {
      font-size: 14px;
      font-weight: 500;
      color: var(--sura-light-blue);
      text-transform: capitalize;
    }
    .instructions {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 22px;
    }
    .btn-action {
      display: block;
      width: 100%;
      background-color: var(--sura-blue);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 51, 160, 0.25);
      transition: background-color 0.2s ease;
    }
    .btn-action:active {
      background-color: #002270;
    }
    .footer-note {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-banner">
      <img src="banner-sura.jpg" alt="SURA Salud en Casa">
    </div>

    <div class="content">
      <span class="badge">Seguimiento Asistencial</span>
      <h2 class="program-title">SALUD EN CASA SURA</h2>

      <div class="staff-container">
        <div class="staff-label">Profesional que atendió:</div>
        <div id="staff-name" class="staff-name">Cargando información...</div>
        <div id="staff-role" class="staff-role"></div>
      </div>

      <p class="instructions">
        Al finalizar la atención en su domicilio, por favor apoye nuestro seguimiento a la técnica PUSH completando la siguiente encuesta.
      </p>

      <a id="btn-survey" href="#" class="btn-action">REALIZAR ENCUESTA</a>

      <div class="footer-note">
        Su opinión es reservada y confidencial.
      </div>
    </div>
  </div>

  <script>
    // Plantilla de Microsoft Forms con el parámetro pre-rellenado de cédula
    const FORMS_TEMPLATE_URL = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=_tQLPBERE02ODHwzuet1gbwcvFikyTdGimt38mvcRppUN0lWR0lJSjc0UUJBSkpCNVpFRk5QUkRXQS4u&rf9a7766a183e4746b8eaa33abfd11dda=";

    function getParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const docId = getParam('id');

    fetch('personal.json')
      .then(response => response.json())
      .then(data => {
        if (docId && data[docId]) {
          const colaborador = data[docId];
          document.getElementById('staff-name').textContent = colaborador.nombre;
          document.getElementById('staff-role').textContent = colaborador.cargo;
        } else {
          document.getElementById('staff-name').textContent = "Atención Domiciliaria";
          document.getElementById('staff-role').textContent = "Equipo de Salud";
        }
      })
      .catch(err => {
        document.getElementById('staff-name').textContent = "Atención Domiciliaria";
        document.getElementById('staff-role').textContent = "Equipo de Salud";
      });

    // Inyectar la cédula capturada al botón de Microsoft Forms
    const idParaFormulario = docId ? encodeURIComponent(docId) : "";
    document.getElementById('btn-survey').href = FORMS_TEMPLATE_URL + idParaFormulario;
  </script>
</body>
</html>
